name: Build Android APK (NexusTrade Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Verify & Publish NexusTrade Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor CLI 8+)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21 (Required by Capacitor Android 8+ & Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            yes | "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Gradle Wrapper JAR & Permissions
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Exists & Validate Integrity
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Compiled APK not found or empty at $APK_PATH"
            exit 1
          fi

          unzip -tq "$APK_PATH"
          ls -lh "$APK_PATH"

          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_BYTES=$(stat -c%s "$APK_PATH")
          APK_MB=$(awk "BEGIN {printf \"%.2f MB\", $APK_BYTES / (1024 * 1024)}")
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p build-artifacts
          cp "$APK_PATH" build-artifacts/app-debug.apk
          cp "$APK_PATH" build-artifacts/NexusTradePro-debug.apk

          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_MB} (${APK_BYTES} bytes)" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusTradePro-Android-APK
          path: |
            build-artifacts/app-debug.apk
            build-artifacts/NexusTradePro-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with app-debug.apk
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify_apk.outputs.release_tag }}
          APK_SHA256: ${{ steps.verify_apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.verify_apk.outputs.apk_size }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

          gh release create "$RELEASE_TAG" ./app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NexusTrade Pro Android Debug APK (${RELEASE_TAG})" \
            --notes "Automated Capacitor Android Debug APK build for **NexusTrade Pro** (\`com.nexustrade.pro\`).

          - **Asset**: \`app-debug.apk\`
          - **Size**: ${APK_SIZE}
          - **SHA-256**: \`${APK_SHA256}\`
          - **Direct Download**: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk" \
            --latest

          {
            echo "## NexusTrade Pro Android APK Published"
            echo ""
            echo "- **Release Tag**: \`${RELEASE_TAG}\`"
            echo "- **APK Size**: ${APK_SIZE}"
            echo "- **SHA-256**: \`${APK_SHA256}\`"
            echo "- **GitHub Release Page**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- **Direct Latest APK Download URL**: [https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk)"
          } >> "$GITHUB_STEP_SUMMARY"
