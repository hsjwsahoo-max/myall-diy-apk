name: Build Android APK (NexusTrade Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package NexusTrade Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Gradle Wrapper JAR & Permissions
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/NexusTradePro.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/NexusTradePro-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusTradePro-Android-APK
          path: |
            build-artifacts/NexusTradePro.apk
            build-artifacts/NexusTradePro-debug.apk
          retention-days: 30
          if-no-files-found: error
