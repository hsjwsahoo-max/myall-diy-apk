name: Publish Android Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate & Publish Debug APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Pre-Compiled APK and SHA-256 Checksum
        id: validate
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH does not exist."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty."
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "Error: $SHA_PATH does not exist."
            exit 1
          fi

          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          EXPECTED_SHA=$(awk '{print $1}' "$SHA_PATH" | head -n 1)

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Error: SHA-256 mismatch! Expected $EXPECTED_SHA, got $ACTUAL_SHA."
            exit 1
          fi

          unzip -tq "$APK_PATH"

          APK_BYTES=$(stat -c%s "$APK_PATH")
          APK_MB=$(awk "BEGIN {printf \"%.2f MB\", $APK_BYTES / (1024 * 1024)}")
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "sha256=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_MB} (${APK_BYTES} bytes)" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload app-debug.apk
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE: ${{ steps.validate.outputs.apk_size }}
        run: |
          set -euo pipefail

          cp apk-distribution/app-debug.apk ./app-debug.apk

          gh release create "$RELEASE_TAG" ./app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Android Debug APK (${RELEASE_TAG})" \
            --notes "Pre-compiled Android Debug APK published automatically.

          - **Asset**: \`app-debug.apk\`
          - **Size**: ${APK_SIZE}
          - **SHA-256**: \`${APK_SHA256}\`
          - **Direct Latest Download**: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk" \
            --latest

      - name: Write Publication Summary
        if: success()
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE: ${{ steps.validate.outputs.apk_size }}
        run: |
          RELEASE_PAGE="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DIRECT_DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          echo "Release Tag: ${RELEASE_TAG}"
          echo "APK Size: ${APK_SIZE}"
          echo "SHA-256: ${APK_SHA256}"
          echo "GitHub Release Page: ${RELEASE_PAGE}"
          echo "Direct Latest APK Download URL: ${DIRECT_DOWNLOAD}"

          {
            echo "## Android Debug APK Published"
            echo ""
            echo "- **Release Tag**: \`${RELEASE_TAG}\`"
            echo "- **APK Size**: ${APK_SIZE}"
            echo "- **SHA-256 Checksum**: \`${APK_SHA256}\`"
            echo "- **GitHub Release Page**: [${RELEASE_PAGE}](${RELEASE_PAGE})"
            echo "- **Direct Latest-Release APK Download URL**: [${DIRECT_DOWNLOAD}](${DIRECT_DOWNLOAD})"
          } >> "$GITHUB_STEP_SUMMARY"
